<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pusula">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Pusula — Portföy ve Piyasa</title>
<style>
:root{--bg:#0a0c0f;--card:#13161b;--card2:#1a1e25;--line:#252a33;--text:#e9ecef;--muted:#8a929d;--up:#34c77b;--down:#f0605d;--warn:#f2b33d;--accent:#7aa7ff;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;max-width:700px;margin:0 auto;background:linear-gradient(var(--bg) 75%,rgba(10,12,15,0))}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
h1{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.1}
main{max-width:700px;margin:0 auto;padding:0 14px}
.tab{display:none}.tab.active{display:block;animation:fade .2s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 12px}
.card>h2,.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:650}
.sec{margin:18px 4px 8px}
.big{font-size:34px;font-weight:720;letter-spacing:-.025em;line-height:1.1}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.up{color:var(--up)}.down{color:var(--down)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}.right{text-align:right}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list>.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.list>.item:first-child{border-top:0;padding-top:2px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.up{background:rgba(52,199,123,.12);border-color:rgba(52,199,123,.35)}
.pill.down{background:rgba(240,96,93,.12);border-color:rgba(240,96,93,.35)}
.pill.flat{color:var(--muted)}
.btn{appearance:none;border-radius:13px;padding:12px 16px;font-weight:650;background:var(--card2);border:1px solid var(--line);cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#08101f;border-color:transparent}
.btn.block{display:block;width:100%;margin-top:8px}
.btn.danger{color:var(--down)}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:11px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.spin svg{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.tabbar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:rgba(14,16,20,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar .in{display:flex;width:100%;max-width:700px}
.tabbar button{flex:1;background:none;border:0;color:var(--muted);font-size:10.5px;font-weight:650;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;cursor:pointer}
.tabbar svg{width:24px;height:24px}
.tabbar button.active{color:var(--accent)}
.rule{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--line)}
.rule:first-of-type{border-top:0;padding-top:2px}
.rule .ic{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800;margin-top:1px}
.ic.warn{background:rgba(242,179,61,.15);color:var(--warn)}.ic.info{background:rgba(122,167,255,.15);color:var(--accent)}.ic.ok{background:rgba(52,199,123,.15);color:var(--up)}
.rule b{display:block;font-size:14.5px}.rule p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-card{position:relative;width:100%;max-width:700px;max-height:92vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:8px 18px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-card h3{margin:0 0 6px;font-size:19px}
label.f{display:block;margin:12px 0 5px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:200px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:9px 4px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:13px;font-weight:650;cursor:pointer}
.seg button.on{background:rgba(122,167,255,.16);border-color:var(--accent);color:var(--accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.mcard .v{font-size:18px;font-weight:700;margin:2px 0 6px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#262c37;border:1px solid #333a47;padding:10px 14px;border-radius:13px;z-index:30;white-space:pre-line;max-width:90vw;font-size:13.5px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.hidden{display:none!important}
.banner{max-width:672px;margin:0 auto 10px;padding:9px 12px;border-radius:13px;background:rgba(242,179,61,.1);border:1px solid rgba(242,179,61,.35);color:#f6cf7c;font-size:13px}
.bannerwrap{padding:0 14px}
.reasons{list-style:none;padding:0;margin:10px 0}
.reasons li{padding:3px 0 3px 24px;position:relative;font-size:14px}
.reasons li:before{position:absolute;left:2px;top:3px;font-weight:800}
.reasons li.ok:before{content:"✓";color:var(--up)}.reasons li.no:before{content:"✗";color:var(--down)}
.reasons li.w:before{content:"!";color:var(--warn);left:6px}.reasons li.n:before{content:"·";color:var(--muted);left:6px}
.spark{width:100%;height:58px;display:block;margin:8px 0 2px}
.meter{position:relative;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(240,96,93,.55),rgba(138,146,157,.35) 50%,rgba(52,199,123,.55));margin:10px 0 4px}
.meter i{position:absolute;top:-4px;width:4px;height:16px;border-radius:2px;background:#fff;transform:translateX(-2px);box-shadow:0 0 0 2px var(--card)}
.alloc{display:flex;gap:16px;align-items:center}
.alloc svg{width:118px;height:118px;flex:none}
.leg{flex:1;min-width:0}
.leg .l{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:3px 0}
.bar{position:relative;height:5px;border-radius:3px;background:var(--card2);margin:2px 0 5px 18px}
.bar span{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar em{position:absolute;top:-3px;width:2px;height:11px;background:var(--text);opacity:.7}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.chip{padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:650;cursor:pointer}
.chip.on{background:rgba(122,167,255,.16);border-color:var(--accent);color:var(--accent)}
.news .item{display:block;cursor:default}
.news a{color:var(--text);text-decoration:none;font-weight:600;font-size:14.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;background:rgba(122,167,255,.14);color:var(--accent);margin-right:4px}
details{margin-top:6px}details summary{cursor:pointer;color:var(--accent);font-size:13.5px;font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details p,details li{color:var(--muted);font-size:13.5px}
.empty{text-align:center;padding:28px 18px}
.empty h2{text-transform:none;letter-spacing:0;font-size:20px;color:var(--text)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.kpis div{background:var(--card2);border-radius:12px;padding:9px 10px}
.kpis b{display:block;font-size:15px}
.adv{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:var(--card2);font-size:14px}
.adv p{margin:0 0 4px}.adv p:last-child{margin:0}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.hdr h4{margin:0;font-size:18px}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
a{color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="#7aa7ff" stroke-width="2"/><path d="M16 6l4 10-4 10-4-10z" fill="#7aa7ff"/><path d="M16 16l4 0-4 10z" fill="#34c77b"/></svg>
    <div><h1>Pusula</h1><div id="status" class="muted tiny">Hazır</div></div>
  </div>
  <button id="refreshBtn" class="iconbtn" aria-label="Verileri yenile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></button>
</header>
<div class="bannerwrap"><div id="demoBanner" class="banner hidden"></div></div>
<main>
  <div id="pfBar" class="chips" style="flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-bottom:10px"></div>
  <section id="tab-portfoy" class="tab active"></section>
  <section id="tab-gorunum" class="tab"></section>
  <section id="tab-tarama" class="tab"></section>
  <section id="tab-haber" class="tab"></section>
  <section id="tab-karne" class="tab"></section>
  <section id="tab-ayar" class="tab"></section>
</main>
<nav class="tabbar"><div class="in">
  <button data-tab="portfoy" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12h8.5"/></svg>Portföy</button>
  <button data-tab="gorunum"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Görünüm</button>
  <button data-tab="tarama"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 12.5l2-2 1.5 1.5 2.5-2.5"/></svg>Fırsatlar</button>
  <button data-tab="haber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5"/></svg>Haberler</button>
  <button data-tab="karne"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><rect x="4" y="3.5" width="16" height="17" rx="2.5"/></svg>Karne</button>
  <button data-tab="ayar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ayarlar</button>
</div></nav>
<div id="sheet" class="sheet hidden"><div class="sheet-bg" data-act="close"></div><div class="sheet-card" id="sheetCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script>
'use strict';
/* ================= Sabitler ================= */
const CLS = {
  BIST: {label:'BIST Hisse', cur:'TRY', color:'#7aa7ff', hint:'Hisse kodu, örn. THYAO'},
  US:   {label:'ABD Hisse/ETF', cur:'USD', color:'#b892ff', hint:'Örn. AAPL, VOO, QQQ'},
  FUND: {label:'TEFAS Fonu', cur:'TRY', color:'#4fd1c5', hint:'3 harfli fon kodu, örn. TTE'},
  FX:   {label:'Döviz', cur:'TRY', color:'#f6ad55', hint:'USD, EUR veya GBP'},
  GOLD: {label:'Gram Altın', cur:'TRY', color:'#f0c419', hint:''},
  COM:  {label:'Emtia', cur:'TRY', color:'#e07a5f', hint:''},
  BES:  {label:'BES Fonu', cur:'TRY', color:'#63b3ed', hint:'TEFAS emeklilik fonu kodu, örn. AEA'},
  TRY:  {label:'TL Nakit/Mevduat', cur:'TRY', color:'#9aa4b2', hint:''}
};
// Emtialar: Yahoo vadeli kontrat fiyatları. gram:true olanlar TL/gram'a çevrilir (ons fiyatı × USD/TRY ÷ 31,1035)
const COMS = {
  GUMUS:    {name:'Gram Gümüş', yf:'SI=F', gram:true, unit:'gram', kw:'gümüş, silver'},
  PLATIN:   {name:'Gram Platin', yf:'PL=F', gram:true, unit:'gram', kw:'platin, platinum'},
  PALADYUM: {name:'Gram Paladyum', yf:'PA=F', gram:true, unit:'gram', kw:'paladyum, palladium'},
  ONS:      {name:'Ons Altın', yf:'GC=F', unit:'ons', kw:'altın, gold, ons'},
  BRENT:    {name:'Brent Petrol', yf:'BZ=F', unit:'varil', kw:'brent, petrol, oil, opec'},
  WTI:      {name:'WTI Petrol', yf:'CL=F', unit:'varil', kw:'wti, petrol, crude, opec'},
  DOGALGAZ: {name:'Doğal Gaz', yf:'NG=F', unit:'MMBtu', kw:'doğal gaz, doğalgaz, natural gas, lng'},
  BAKIR:    {name:'Bakır', yf:'HG=F', unit:'libre', kw:'bakır, copper'}
};
const curOfH = (cls, sym) => cls === 'US' ? 'USD' : cls === 'COM' ? (COMS[sym] && COMS[sym].gram ? 'TRY' : 'USD') : 'TRY';
const curSym = (cls, sym) => curOfH(cls, sym) === 'USD' ? ' $' : ' ₺';
const dispName = (cls, sym) => cls === 'GOLD' ? 'Gram Altın' : cls === 'COM' ? (COMS[sym] ? COMS[sym].name : sym) : cls === 'FX' ? String(sym).toUpperCase() + '/TRY' : String(sym).toUpperCase();
const MARKET = [
  {key:'y:XU100.IS', name:'BIST 100'},
  {key:'y:^GSPC', name:'S&P 500'},
  {key:'y:USDTRY=X', name:'USD/TRY'},
  {key:'gold', name:'Gram Altın'},
  {key:'gram:SI=F', name:'Gram Gümüş'},
  {key:'y:BZ=F', name:'Brent Petrol'}
];
const H = 21; // sinyal ufku: ~1 ay (işlem günü)
// Geniş tarama evreni (artık işlem görmeyen bir kod varsa sessizce atlanır)
const BIST_UNI = 'AEFES,AGHOL,AGROT,AHGAZ,AKBNK,AKCNS,AKFGY,AKFYE,AKSA,AKSEN,ALARK,ALBRK,ALFAS,ALTNY,ANSGR,ARCLK,ASELS,ASTOR,BERA,BIENY,BIMAS,BINHO,BIOEN,BRSAN,BRYAT,BUCIM,CANTE,CCOLA,CIMSA,CLEBI,CWENE,DOAS,DOHOL,DSTKF,ECILC,EFORC,EGEEN,EKGYO,ENERY,ENJSA,ENKAI,EREGL,EUPWR,EUREN,FROTO,GARAN,GESAN,GLRMK,GRSEL,GUBRF,GWIND,HALKB,HEKTS,IPEKE,ISCTR,ISGYO,ISMEN,IZENR,KARSN,KCAER,KCHOL,KONTR,KONYA,KORDS,KOZAA,KOZAL,KRDMD,KZBGY,LMKDC,MAVI,MGROS,MIATK,MPARK,OBAMS,ODAS,OTKAR,OYAKC,PAPIL,PASEU,PETKM,PGSUS,QUAGR,RALYH,REEDR,SAHOL,SASA,SDTTR,SISE,SKBNK,SMRTG,SOKM,TABGD,TAVHL,TCELL,TERA,THYAO,TKFEN,TOASO,TRALT,TRMET,TSKB,TTKOM,TTRAK,TUKAS,TUPRS,TUREX,TURSG,ULKER,VAKBN,VESBE,VESTL,YEOTK,YKBNK,ZOREN';
const US_UNI = 'SPY,QQQ,DIA,IWM,VTI,VOO,EFA,EEM,TLT,GLD,SLV,IBIT,SMH,XLK,XLF,XLE,XLV,XLI,XLY,XLP,XLU,XLB,XLRE,XLC,AAPL,MSFT,NVDA,AMZN,GOOGL,META,TSLA,AVGO,BRK-B,JPM,LLY,V,MA,UNH,XOM,COST,WMT,HD,PG,JNJ,ORCL,NFLX,AMD,CRM,ADBE,PLTR,KO,PEP,MRK,ABBV,BAC,CVX,MCD,CSCO,INTC,QCOM,TXN,IBM,GE,CAT,UBER,SHOP,MU,ASML,TSM,ARM,PANW,CRWD,NOW,ISRG,BKNG,DIS,NKE,SBUX,PYPL,COIN,MSTR,ANET,GS,MS,RTX';

/* ================= Depolama ================= */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('pusula.'+k); if(v!=null) return JSON.parse(v); }catch(e){} return (k in mem) ? mem[k] : d; },
  set(k, v){ mem[k] = v; try{ localStorage.setItem('pusula.'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ delete mem[k]; try{ localStorage.removeItem('pusula.'+k); }catch(e){} }
};
const DEF_TARGETS = {BIST:25, US:20, FUND:15, FX:15, GOLD:15, COM:5, TRY:5};
let settings = Object.assign({workerUrl:'', extraBist:'', extraUs:'', scanFunds:''}, store.get('settings', {}));
// Portföyler: her biri ayrı varlık listesi ve hedef dağılımla tutulur (ör. Ana Portföy, BES sözleşmeleri)
let portfolios = store.get('portfolios', null);
if(!Array.isArray(portfolios) || !portfolios.length){
  portfolios = [{id:'main', name:'Ana Portföy', kind:'genel', holdings:store.get('holdings', []), targets:Object.assign({}, DEF_TARGETS, settings.targets || {})}];
  store.set('portfolios', portfolios);
}
let pf = portfolios.find(x => x.id === store.get('activePf', '')) || portfolios[0];
let holdings = pf.holdings;
function savePf(){ pf.holdings = holdings; store.set('portfolios', portfolios); store.set('activePf', pf.id); }
const isBes = () => pf.kind === 'bes';
let scanRes = [], scanning = false, scanTime = null, scanDone = 0, scanTotal = 0, scanFilter = 'new', discovered = {us:[], bist:[]};
let signalLog = store.get('log', []);
let series = {}, news = [], newsDemo = false, lastUpdate = null, newsFilter = 'mine';
let rows = [], totals = {}, byCls = {}, rules = [], market = [];

/* ================= Yardımcılar ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = d => new Intl.NumberFormat('tr-TR', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtNum = (v, d=2) => v==null || isNaN(v) ? '—' : new Intl.NumberFormat('tr-TR', {maximumFractionDigits:d}).format(v);
const fmtTRY = v => v==null || isNaN(v) ? '—' : '₺' + (Math.abs(v) >= 1000 ? nf(0) : nf(2)).format(v);
const fmtUSD = v => v==null || isNaN(v) ? '—' : '$' + (Math.abs(v) >= 1000 ? nf(0) : nf(2)).format(v);
// Görüntüleme para birimi: TL tutarı, seçime göre TL ya da bugünkü kurla dolar olarak yazılır
const inUsd = () => settings.dispCur === 'USD' && !!usdtry();
/* ---- Dönemsel değişim (günlük, haftalık, aylık...) ---- */
const PERIODS = [['pl', 'K/Z'], ['1d', '1G'], ['1w', '1H'], ['1m', '1A'], ['3m', '3A'], ['ytd', 'YB'], ['1y', '1Y']];
const PERIOD_NAMES = {pl:'maliyete göre', '1d':'günlük', '1w':'1 hafta', '1m':'1 ay', '3m':'3 ay', ytd:'yılbaşından beri', '1y':'1 yıl'};
const curPeriod = () => settings.period || 'pl';
function refTime(per){
  const n = new Date(), now = Date.now();
  switch(per){
    case '1d': return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime() - 1; // dünkü kapanış
    case '1w': return now - 7*864e5;
    case '1m': return now - 30*864e5;
    case '3m': return now - 91*864e5;
    case 'ytd': return new Date(n.getFullYear(), 0, 1).getTime() - 1;

    if(i <= 14){ g += u; l += dn; if(i === 14){ g /= 14; l /= 14; rsi[i] = l === 0 ? 100 : 100 - 100/(1 + g/l); } }
    else { g = (g*13 + u)/14; l = (l*13 + dn)/14; rsi[i] = l === 0 ? 100 : 100 - 100/(1 + g/l); }
  }

    {k:checks[1] ? 'ok' : 'no', t:'Fiyat 200 günlük ortalamanın ' + (checks[1] ? 'üstünde' : 'altında')},
    {k:checks[2] ? 'ok' : 'no', t:checks[2] ? '50 günlük ortalama 200 günlüğün üstünde (yükseliş yapısı)' : '50 günlük ortalama 200 günlüğün altında (düşüş yapısı)'},

  }
  rows.forEach(a => {
    if(a.weight > 0.25 && a.h.cls !== 'TRY') R.push({hid:a.h.id, lvl:'warn', title:`${dispName(a.h.cls, a.h.sym)}: tek varlıkta yoğunlaşma`, text:`Portföyün %${pc(a.weight)}'i bu varlıkta. Sert bir düşüş tüm portföyü etkiler; tek varlık için genelde %10-20 üstü riskli kabul edilir.`});
  });
  const hedge = (byCls.FX||0) + (byCls.GOLD||0) + (byCls.US||0) + (byCls.COM||0);
  if(hedge < 0.2) R.push({lvl:'warn', title:'Kur ve enflasyon koruması zayıf', text:`Döviz, altın, emtia ve ABD varlıklarının toplam payı %${pc(hedge)}. TL'deki değer kaybına karşı koruman düşük.`});
  if(hedge > 0.85) R.push({lvl:'info', title:'Neredeyse tamamen döviz/altın', text:`Payı %${pc(hedge)}. Kur sakin kalırsa veya TL reel getirisi yüksek olursa geride kalabilirsin.`});
  rows.forEach(a => {
    if(a.o && a.o.d === -1 && a.weight > 0.1) R.push({hid:a.h.id, lvl:'warn', title:`${dispName(a.h.cls, a.h.sym)}: düşüş eğiliminde`, text:`Portföyün %${pc(a.weight)}'i ve teknik görünüm zayıf (sinyal güveni: ${a.o.conf.t.toLowerCase()}).`});
    if(a.pl != null && a.pl > 0.5 && a.o && a.o.R > 70) R.push({hid:a.h.id, lvl:'info', title:`${dispName(a.h.cls, a.h.sym)}: yüksek kâr + aşırı alım`, text:`Maliyetine göre %${pc(a.pl)} kârda ve RSI ${a.o.R.toFixed(0)}. Kademeli kâr almayı düşünebilirsin.`});
    if(a.pl != null && a.pl < -0.25) R.push({hid:a.h.id, lvl:'info', title:`${dispName(a.h.cls, a.h.sym)}: büyük zarar`, text:`Maliyetine göre %${pc(-a.pl)} zararda. Pozisyonu tutma gerekçeni gözden geçir.`});
  });
  Object.keys(CLS).forEach(k => {
    const t = (pf.targets[k] || 0)/100, cur = byCls[k] || 0, diff = cur - t;
    if(Math.abs(diff) >= 0.05) R.push({lvl:'info', title:`${CLS[k].label}: hedefin ${diff > 0 ? 'üstünde' : 'altında'}`, text:`Şu an %${pc(cur)}, hedefin %${pc(t)}. Dengelemek için yaklaşık ${fmtV(Math.abs(diff)*tot)} ${diff > 0 ? 'azaltılabilir' : 'eklenebilir'}.`});
  });
  if(!R.some(r => r.lvl === 'warn')) R.unshift({lvl:'ok', title:'Belirgin bir risk uyarısı yok', text:'Dağılım ve pozisyonlar kurallara göre dengeli görünüyor.'});
  const ord = {warn:0, info:1, ok:2};
  return R.sort((x, y) => ord[x.lvl] - ord[y.lvl]);
}
function computeAll(){
  const fx = usdtry();
  rows = holdings.map(h => {
    const price = priceOf(h), mult = curOfH(h.cls, h.sym) === 'USD' ? fx : 1;
    const valueTRY = (price != null && mult) ? price * h.qty * mult : null;
    const costTRY = (h.cost && mult) ? h.cost * h.qty * mult : null;
    const pl = (price != null && h.cost) ? price/h.cost - 1 : null;
    const s = series[keyFor(h)];
    const o = (s && h.cls !== 'TRY') ? outlook(s.closes) : null;
    return {h, price, valueTRY, costTRY, pl, o, s};
  });
  const tot = rows.reduce((a, r) => a + (r.valueTRY || 0), 0);
  let cost = 0, val = 0;
  rows.forEach(r => { if(r.valueTRY != null && r.costTRY != null){ cost += r.costTRY; val += r.valueTRY; } });
  byCls = {};
  rows.forEach(r => { r.weight = tot ? (r.valueTRY || 0)/tot : 0; byCls[r.h.cls] = (byCls[r.h.cls] || 0) + r.weight; });
  rows.forEach(r => { r.news = newsFor(r.h); r.newsScore = r.news.slice(0, 10).reduce((a, n) => a + (n.sent || 0), 0); r.advice = advise(r); });
  totals = {tot, cost, plAbs:cost ? val - cost : null, pl:cost ? val/cost - 1 : null, usd:fx ? tot/fx : null};
  rules = portfolioRules(tot);
  market = MARKET.map(m => { const s = series[m.key]; return {...m, s, o:s ? outlook(s.closes) : null}; });
}

/* ================= Sinyal karnesi ================= */
function logSignals(){
  if(!settings.workerUrl) return; // demo verisi kaydedilmez
  const d = today(), seen = new Set();
  const items = [...rows.filter(r => r.o && !r.o.insufficient).map(r => ({key:keyFor(r.h), name:String(r.h.sym).toUpperCase(), o:r.o, s:r.s})),
                 ...market.filter(m => m.o && !m.o.insufficient).map(m => ({key:m.key, name:m.name, o:m.o, s:m.s}))];
  items.forEach(it => {
    if(seen.has(it.key) || !it.s || it.s.stale || it.s.demo) return; seen.add(it.key);
    if(signalLog.some(e => e.d === d && e.key === it.key)) return;
    signalLog.push({d, t:Date.now(), key:it.key, name:it.name, dir:it.o.d, label:it.o.label, score:it.o.s, price:it.s.price ?? it.s.closes.at(-1)[1]});
  });
  if(signalLog.length > 3000) signalLog = signalLog.slice(-3000);
  store.set('log', signalLog);
}
function priceAfter(key, t, days){
  const s = series[key]; if(!s) return null;
  const target = t + days*864e5; if(Date.now() < target) return null;
  for(const [ts, v] of s.closes) if(ts >= target) return v;
  return s.price ?? null;
}

let busy = false;
async function refresh(){
  if(busy) return; busy = true;
  $('#refreshBtn').classList.add('spin'); setStatus('Güncelleniyor…');
  const keys = new Set(['y:USDTRY=X', ...MARKET.map(m => m.key)]);
  holdings.forEach(h => { if(!h.manualPrice){ const k = keyFor(h); if(k) keys.add(k); } });
  const errs = [];
  await Promise.all([...keys].map(async k => {
    try{ series[k] = await loadKey(k); }
    catch(e){ const c = store.get('cache:'+k, null); if(c) series[k] = {...c.d, stale:true}; errs.push(k.replace(/^[yf]:/, '').replace('gold','Altın') + ': ' + e.message); }
  }));

  lastUpdate = Date.now();
  applyBesPlan();
  computeAll(); logSignals(); renderAll();
  busy = false; $('#refreshBtn').classList.remove('spin');
  setStatus((settings.workerUrl ? 'Güncellendi ' : 'Demo veri · ') + new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'}) + (errs.length ? ` · ${errs.length} kaynak alınamadı` : ''));
  if(errs.length) toast('Alınamayan veriler:\n' + errs.slice(0, 4).join('\n'), 5000);
}

/* ================= Çizimler ================= */
function spark(closes, n=126){
  const c = closes.slice(-n).map(x => x[1]); if(c.length < 2) return '';
  const w = 300, h = 58, mn = Math.min(...c), mx = Math.max(...c), k = mx - mn || 1;
  const pts = c.map((v, i) => `${(i/(c.length-1)*w).toFixed(1)},${(h - 3 - (v - mn)/k*(h - 6)).toFixed(1)}`).join(' ');
  const col = c.at(-1) >= c[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
const FUND_COLORS = ['#63b3ed', '#b892ff', '#4fd1c5', '#f6ad55', '#f0c419', '#e07a5f', '#9aa4b2', '#7aa7ff'];
function donut(parts){
  parts = parts || Object.keys(CLS).map(k => ({v:byCls[k] || 0, color:CLS[k].color}));
  const R = 46, C = 2*Math.PI*R; let off = 0, segs = '';
  parts.forEach(({v, color}) => {
    if(v <= 0) return;
    const len = Math.max(v*C - 2, 0.5);
    segs += `<circle r="${R}" cx="60" cy="60" fill="none" stroke="${color}" stroke-width="16" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;
    off += v*C;
  });
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--card2)" stroke-width="16"/>${segs}</svg>`;
}
const pillCls = o => !o || o.insufficient ? 'flat' : o.d === 1 ? 'up' : o.d === -1 ? 'down' : 'flat';
const pillTxt = o => !o ? '—' : o.insufficient ? 'Veri az' : o.d === 1 ? '▲ Yükseliş' : o.d === -1 ? '▼ Düşüş' : '■ Yatay';

/* ================= Fırsat tarayıcı ================= */
function scanUniverse(){
  const list = s => String(s || '').toUpperCase().split(/[,\s]+/).map(x => x.trim()).filter(x => /^[A-Z0-9.\-]{1,12}$/.test(x));
  const items = [];
  // Önce keşfedilenler (kaynak etiketi korunsun diye), sonra geniş evren ve kullanıcının ekledikleri
  discovered.bist.forEach(x => items.push({cls:'BIST', sym:x.sym, src:x.src, note:x.note}));
  discovered.us.forEach(x => items.push({cls:'US', sym:x.sym, src:x.src}));
  list(settings.extraBist).forEach(s => items.push({cls:'BIST', sym:s, src:'Senin listen'}));
  list(settings.extraUs).forEach(s => items.push({cls:'US', sym:s, src:'Senin listen'}));
  list(settings.scanFunds).forEach(s => items.push({cls:'FUND', sym:s, src:'Senin listen'}));
  list(BIST_UNI).forEach(s => items.push({cls:'BIST', sym:s}));
  list(US_UNI).forEach(s => items.push({cls:'US', sym:s}));
  ['USD', 'EUR', 'GBP'].forEach(s => items.push({cls:'FX', sym:s}));
  items.push({cls:'GOLD', sym:'GRAM'});
  Object.keys(COMS).forEach(k => items.push({cls:'COM', sym:k}));
  const seen = new Set();
  return items.filter(it => { const k = keyFor(it); if(seen.has(k)) return false; seen.add(k); it.key = k; return true; });
}
async function runScan(){
  if(scanning) return; scanning = true; scanDone = 0; scanTotal = 0; renderScan();
  if(settings.workerUrl){ try{ discovered = await fetchJSON('/discover'); }catch(e){ discovered = {us:[], bist:[]}; } }
  const items = scanUniverse(); scanTotal = items.length; scanRes = [];
  const owned = new Set(holdings.map(h => keyFor(h)));
  renderScan();
  let i = 0, errs = 0;
  const worker = async () => {
    while(i < items.length){
      const it = items[i++];
      try{
        const s = series[it.key] && !series[it.key].stale ? series[it.key] : await loadKey(it.key, false);
        if(owned.has(it.key) || MARKET.some(m => m.key === it.key)) series[it.key] = s;
        const o = outlook(s.closes);
        if(!o.insufficient) scanRes.push({...it, s, o, owned:owned.has(it.key)});
      }catch(e){ errs++; }
      scanDone++;
      if(scanDone % 6 === 0) renderScan();
    }
  };
  await Promise.all(Array.from({length:6}, worker));
  scanning = false; scanTime = Date.now();
  // Bir önceki taramada görmediğin yeni yükseliş sinyallerini işaretle
  const seenBefore = new Set(store.get('seenUp', []));
  const fresh = scanRes.filter(r => r.o.d === 1 && r.o.age != null && r.o.age <= 5);
  scanRes.forEach(r => { if(r.o.d === 1){ const c = r.s.closes; r.o.age0 = dayKey(c[Math.max(0, c.length - 1 - (r.o.age || 0))][0]); } });
  const unseen = fresh.filter(r => !seenBefore.has(r.key + '|' + r.o.age0));
  unseen.forEach(r => r.unseen = true);
  store.set('seenUp', [...seenBefore, ...unseen.map(r => r.key + '|' + r.o.age0)].slice(-600));
  try{ if(navigator.setAppBadge) unseen.length ? navigator.setAppBadge(unseen.length) : navigator.clearAppBadge(); }catch(_){}
  store.set('lastScan', Date.now());
  renderScan();
  if(unseen.length) toast(`${unseen.length} varlıkta yeni yükseliş sinyali var. Fırsatlar sekmesine bak.`, 4000);
  else if(errs > scanTotal/2) toast(`${errs} sembolün verisi alınamadı.`);
}
function rankScan(a, b){
  return (b.o.conf.lvl - a.o.conf.lvl) || (Math.abs(b.o.s) - Math.abs(a.o.s)) || ((b.o.edge || 0) - (a.o.edge || 0));
}

      ${r.src ? `<div class="tiny muted">Kaynak: ${esc(r.src)}${r.note ? ' · “' + esc(r.note.slice(0, 80)) + '”' : ''}</div>` : ''}</div>
      <div class="right small"><div class="${cls(o.r1)}">${pct(o.r1)} <span class="muted">1a</span></div><div class="${cls(o.r3)}">${pct(o.r3)} <span class="muted">3a</span></div></div></div></summary>
    ${spark(r.s.closes)}
    <div class="row between small"><b>${o.label}</b><span class="muted">Puan ${o.s > 0 ? '+' : ''}${o.s} / 6</span></div>
    <ul class="reasons">${o.reasons.map(x => `<li class="${x.k}">${esc(x.t)}</li>`).join('')}</ul>
    ${o.hit != null ? `<div class="small muted">Geçmiş isabet: aynı yönlü sinyal ${o.N} günde oluştu, 1 ay sonra %${pc(o.hit)} doğru çıktı (taban oran %${pc(o.d === 1 ? o.bt.baseUp : 1 - o.bt.baseUp)}).</div>` : ''}
    <div class="adv"><p>${esc(tip)}</p>${o.d === 1 && !r.owned ? '<p class="muted small">Pozisyon büyüklüğü: tek bir yeni varlığa portföyün %5-10\'undan fazlasını ayırmamak genel bir risk kuralıdır.</p>' : ''}</div>
    ${!r.owned && r.cls !== 'GOLD' ? `<button class="btn sm block" data-add-cls="${r.cls}" data-add-sym="${esc(r.sym)}">+ Portföye ekle</button>` : ''}
  </details>`;

function renderScan(){
  const el = $('#tab-tarama'); if(!el) return;

    ${scanTime ? `<div class="muted tiny" style="margin-top:6px;text-align:center">Son tarama ${new Date(scanTime).toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'})} · ${scanRes.length} varlık analiz edildi${discovered.us.length + discovered.bist.length ? ` · ${discovered.us.length + discovered.bist.length} keşif adayı` : ''}${!settings.workerUrl ? ' · demo veri' : ''}</div>` : ''}</div>`;

    const lst = scanFilter === 'new' ? fresh : scanFilter === 'up' ? up : scanFilter === 'down' ? dn : flat;
    if(scanFilter === 'new') h += `<p class="muted small" style="margin:0 4px 10px">Yeni dönen trendler daha erken bir fırsat olabilir, ama oturmuş trendlere göre daha sık geri döner. Güven seviyesine mutlaka bak.</p>`;

  el.innerHTML = h;

function openDetail(id){
  const r = rows.find(x => x.h.id === id); if(!r) return;

/* ================= BES aylık katkı ================= */
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
function priceAtDate(key, t){
  const s = series[key]; if(!s || !s.closes) return null;
  for(const [ts, v] of s.closes) if(ts >= t) return v;
  return Date.now() >= t ? (s.price ?? s.closes.at(-1)?.[1] ?? null) : null;
}
// Katkıyı fonlara böler, o tarihteki fiyatla pay adedine çevirir, ortalama maliyeti günceller
function addContribution(amount, split, t, auto, dkPct){
  const parts = Object.entries(split).filter(([, v]) => v > 0);
  const tot = parts.reduce((a, [, v]) => a + v, 0); if(!tot) return false;
  const buys = [];
  for(const [id, w] of parts){
    const h = holdings.find(x => x.id === id); if(!h) continue;
    const px = h.manualPrice ? +h.manualPrice : priceAtDate(keyFor(h), t);
    if(!px) return false; // fiyat yoksa bu katkıyı sonra tekrar dene
    buys.push([h, amount * w / tot, px]);
  }
  if(dkPct > 0 && pf.plan && pf.plan.dkFund){
    const h = holdings.find(x => x.id === pf.plan.dkFund);
    const px = h ? (h.manualPrice ? +h.manualPrice : priceAtDate(keyFor(h), t)) : null;
    if(h && !px) return false;
    if(h) buys.push([h, amount * dkPct / 100, px, true]);
  }
  buys.forEach(([h, amt, px]) => {
    const add = amt / px;
    if(h.cost) h.cost = (h.cost * h.qty + amt) / (h.qty + add);
    h.qty += add;
  });
  pf.contribs = pf.contribs || [];
  pf.contribs.push({t, amount, dk:dkPct > 0 ? amount * dkPct / 100 : 0, auto:!!auto});
  return true;
}
function applyBesPlan(){
  const P = pf.plan; if(!isBes() || !P || !P.amount) return;
  const now = new Date(); let applied = 0;
  let [y, m] = P.last.split('-').map(Number);
  for(let i = 0; i < 36; i++){
    m++; if(m > 12){ m = 1; y++; }
    const day = Math.min(P.day, new Date(y, m, 0).getDate());
    const due = new Date(y, m - 1, day, 12);
    if(due > now) break;
    if(!addContribution(P.amount, P.split, due.getTime(), true, P.dkPct || 0)) break;
    P.last = ym(due); applied++;
  }
  if(applied){ savePf(); toast(`${applied} aylık katkı eklendi (₺${fmtNum(P.amount * applied, 0)}). Pay adetleri güncellendi.`, 4000); }
}

function importData(file){

      const clean = list => (list || []).filter(h => h && CLS[h.cls] && h.qty > 0).map(h => ({...h, id:h.id || uid()}));
      if(Array.isArray(j.portfolios) && j.portfolios.length) portfolios = j.portfolios.map(x => ({id:x.id || uid(), name:x.name || 'Portföy', kind:x.kind === 'bes' ? 'bes' : 'genel', company:x.company || '', holdings:clean(x.holdings), targets:x.targets || {}}));

      else throw new Error();
      pf = portfolios[0]; holdings = pf.holdings;
      if(j.settings && j.settings.workerUrl != null) settings.workerUrl = j.settings.workerUrl;

      toast('Yedek geri yüklendi.'); refresh();

  navigator.serviceWorker.register('sw.js').catch(() => {});
}
computeAll(); renderAll();
refresh().then(() => {
  // Uygulama her açıldığında, son taramadan 4 saat geçtiyse yeni fırsatları arka planda tara
  if(settings.workerUrl && Date.now() - store.get('lastScan', 0) > 4*36e5) runScan();
});
</script>
